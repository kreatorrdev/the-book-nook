services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: booknook
      POSTGRES_USER: booknook
      POSTGRES_PASSWORD: booknook
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - booknook-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booknook"]
      interval: 5s
      retries: 10
volumes:
  booknook-postgres:
